# Integrationstest: echte Nextcloud mit MariaDB. Nur für Tests, Daten liegen im Arbeitsspeicher.
services:
  db:
    image: mariadb:lts
    command: --transaction-isolation=READ-COMMITTED
    tmpfs: [/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: root-test
      MYSQL_PASSWORD: nc-test
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
  app:
    image: ${NC_IMAGE:-nextcloud:34-apache}
    ports: ["127.0.0.1:${NC_PORT:-8081}:80"]
    depends_on: [db]
    volumes:
      - ../..:/var/www/html/custom_apps/lagerplaner:ro
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nc-test
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-test-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
